name: KRX 자동매매 봇 (모의투자)

on:
  schedule:
    # 매 5분마다, 00:00~06:30 UTC (=09:00~15:30 KST), 평일에 실행
    - cron: "*/5 0-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests pandas finance-datareader

      - name: 자동매매 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python krx_autotrader.py

      - name: 상태 파일 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add krx_autotrader_state/ || true
          git diff --cached --quiet || git commit -m "update autotrader state"
          git push || true
